<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="git-sweep removes merged branches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
    .title { font-size: 34px; font-weight: 700; fill: url(#accent); }
    .sub { fill: #8b949e; font-size: 14px; }
    .prompt { fill: #7ee787; }
    .cmd { fill: #e6edf3; }
    .name { fill: #c9d1d9; }
    .tag { fill: #8b949e; }
    .ok { fill: #7ee787; }

    .main { stroke: #58a6ff; stroke-width: 3; fill: none; stroke-linecap: round; }
    .side { stroke: #7ee787; stroke-width: 3; fill: none; stroke-linecap: round;
            stroke-dasharray: 120; stroke-dashoffset: 120; }
    .dot { fill: #58a6ff; }
    .sdot { fill: #7ee787; opacity: 0; }

    .b1 { animation: grow 8s ease-out infinite, sweep 8s ease-in infinite; }
    .b2 { animation: grow 8s ease-out infinite 0.5s, sweep 8s ease-in infinite 0.5s; }
    .b3 { animation: grow 8s ease-out infinite 1s, sweep 8s ease-in infinite 1s; }
    .d1 { animation: dot 8s infinite; }
    .d2 { animation: dot 8s infinite 0.5s; }
    .d3 { animation: dot 8s infinite 1s; }

    .line { opacity: 0; animation: show 8s infinite; }
    .l1 { animation-delay: 0.3s; }
    .l2 { animation-delay: 1.0s; }
    .l3 { animation-delay: 1.3s; }
    .l4 { animation-delay: 1.6s; }
    .l5 { animation-delay: 2.6s; }
    .l6 { animation-delay: 3.4s; }
    .strike { stroke: #ff7b72; stroke-width: 2; stroke-dasharray: 200; stroke-dashoffset: 200;
              animation: strike 8s infinite; }
    .s1 { animation-delay: 2.8s; }
    .s2 { animation-delay: 3.0s; }
    .s3 { animation-delay: 3.2s; }
    .cursor { fill: #e6edf3; animation: blink 1s steps(1) infinite; }

    @keyframes grow { 0% { stroke-dashoffset: 120; } 30% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
    @keyframes sweep { 0%, 55% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes dot { 0%, 25% { opacity: 0; } 32%, 55% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes show { 0% { opacity: 0; } 4% { opacity: 1; } 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
    @keyframes strike { 0% { stroke-dashoffset: 200; } 8% { stroke-dashoffset: 0; } 88% { stroke-dashoffset: 0; } 96%, 100% { stroke-dashoffset: 200; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>
  <rect width="820" height="260" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="819" height="259" rx="14" fill="none" stroke="#30363d"/>

  <text class="title" x="40" y="62">git-sweep</text>
  <text class="sub" x="40" y="88">tidy your branches, safely</text>

  <!-- branch graph -->
  <path class="main" d="M 40 190 H 360"/>
  <circle class="dot" cx="60" cy="190" r="5"/>
  <circle class="dot" cx="140" cy="190" r="5"/>
  <circle class="dot" cx="220" cy="190" r="5"/>
  <circle class="dot" cx="300" cy="190" r="5"/>
  <circle class="dot" cx="350" cy="190" r="5"/>

  <g class="b1"><path class="side b1" d="M 140 190 C 160 190 160 150 190 150 H 260"/></g>
  <circle class="sdot d1" cx="260" cy="150" r="5"/>
  <g class="b2"><path class="side b2" d="M 140 190 C 160 190 160 120 190 120 H 260"/></g>
  <circle class="sdot d2" cx="260" cy="120" r="5"/>
  <g class="b3"><path class="side b3" d="M 220 190 C 240 190 240 215 260 215 H 320"/></g>
  <circle class="sdot d3" cx="320" cy="215" r="5"/>

  <!-- terminal -->
  <rect x="400" y="24" width="396" height="212" rx="10" fill="#010409" stroke="#30363d"/>
  <circle cx="420" cy="42" r="5" fill="#ff5f56"/>
  <circle cx="438" cy="42" r="5" fill="#ffbd2e"/>
  <circle cx="456" cy="42" r="5" fill="#27c93f"/>

  <g class="line l1"><text x="418" y="76"><tspan class="prompt">$ </tspan><tspan class="cmd">git sweep</tspan></text></g>
  <g class="line l2"><text class="name" x="418" y="104">feature/login-form</text><text class="tag" x="640" y="104">merged</text></g>
  <g class="line l3"><text class="name" x="418" y="126">fix/typo-readme</text><text class="tag" x="640" y="126">merged</text></g>
  <g class="line l4"><text class="name" x="418" y="148">chore/deps-bump</text><text class="tag" x="640" y="148">upstream gone</text></g>
  <line class="strike s1" x1="418" y1="99" x2="570" y2="99"/>
  <line class="strike s2" x1="418" y1="121" x2="550" y2="121"/>
  <line class="strike s3" x1="418" y1="143" x2="545" y2="143"/>
  <g class="line l5"><text x="418" y="182"><tspan class="prompt">$ </tspan><tspan class="cmd">git sweep --delete</tspan></text></g>
  <g class="line l6"><text class="ok" x="418" y="206">✔ deleted 3 branches</text></g>
  <rect class="cursor" x="418" y="214" width="9" height="14"/>
</svg>
