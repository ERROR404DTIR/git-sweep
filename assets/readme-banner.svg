<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Git Sweep</title><desc id="d">Stale branch paths are safely identified and swept away.</desc><defs><linearGradient id="bg"><stop stop-color="#172b39"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><g fill="none" stroke="#52677d" stroke-width="4" stroke-linecap="round"><path d="M120 95H420M120 150H420M120 205H420"/><path d="M420 95L480 150L420 205"/></g><g fill="#62e3c1"><circle cx="120" cy="95" r="8"/><circle cx="120" cy="150" r="8"/><circle cx="120" cy="205" r="8"/></g><path d="M480 150H710" stroke="#8fa8ff" stroke-width="4" stroke-dasharray="10 10"><animate attributeName="stroke-dashoffset" values="0;-80" dur="2.5s" repeatCount="indefinite"/></path><path d="M760 85L850 150L760 215Z" fill="#163c3b" stroke="#62e3c1" stroke-width="3"/><text x="805" y="157" fill="#edf3ff" text-anchor="middle" font-family="monospace" font-size="15">CLEAN</text><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">GIT SWEEP</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">INSPECT / DRY RUN / CLEAN</text></svg>